# Posternity site configuration (Zensical).
#
# The deployment overlay is wired in below via the macros plugin: every
# {{ deployment.* }} reference in docs/ resolves from overlay/deployment.yml.
# An institutional deployment replaces that one file and rebuilds.

[project]
site_name = "Posternity"
site_description = "An out-of-band management enclave reference architecture for research computing"
site_url = "https://atmarx.github.io/posternity/"
repo_url = "https://github.com/atmarx/posternity"
repo_name = "atmarx/posternity"
copyright = 'Posternity &copy; 2026 Andrew Marx — docs <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>, code <a href="https://github.com/atmarx/posternity/blob/main/LICENSE-CODE">MIT</a>'

nav = [
  { "Home" = "index.md" },
  { "Architecture" = [
    { "Overview" = "architecture/index.md" },
    { "Network layer" = "architecture/network.md" },
    { "Firewall and HA" = "architecture/firewall-ha.md" },
    { "Utility tier" = "architecture/utility-tier.md" },
    { "Tenant jump VMs" = "architecture/jump-vms.md" },
  ] },
  { "Access and identity" = [
    { "The two doors" = "access/doors.md" },
    { "Identity and authorization" = "access/identity.md" },
  ] },
  { "Library" = [
    { "Overview" = "library/index.md" },
    { "Media share" = "library/media-share.md" },
    { "Curation and refresh" = "library/curation.md" },
    { "Licenses" = "library/licenses.md" },
  ] },
  { "Security posture" = [
    { "Egress policy" = "security/egress.md" },
    { "Audit and monitoring" = "security/audit.md" },
    { "Risk and contingency" = "security/risk-contingency.md" },
  ] },
  { "Operations" = [
    { "Onboarding" = "operations/onboarding.md" },
    { "BMC intake hardening" = "operations/bmc-intake.md" },
    { "Offboarding" = "operations/offboarding.md" },
    { "Attestations" = "operations/attestations.md" },
  ] },
  { "System Security Plan" = "ssp/index.md" },
  { "Reference" = [
    { "Deployment parameters" = "reference/deployment-parameters.md" },
    { "Decisions ledger" = "reference/decisions.md" },
    { "User guide fragments" = "reference/user-guide.md" },
  ] },
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.footer",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.macros]
include_yaml = ["overlay/deployment.yml"]
# A missing overlay key fails the build instead of rendering blank — a
# half-filled overlay must never ship an SSP with holes in it.
on_undefined = "strict"
on_error_fail = true

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.superfences = {}
pymdownx.details = {}
